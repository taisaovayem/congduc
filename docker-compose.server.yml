services:
  postgres:
    restart: unless-stopped

  api:
    restart: unless-stopped

  web:
    restart: unless-stopped
    container_name: congduc-web
    networks:
      default: {}
      web_network:
        aliases:
          - congduc-web

networks:
  web_network:
    external: true
    name: ${WEB_NETWORK:-web_network}
